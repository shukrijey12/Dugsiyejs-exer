<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌍 Multi Language Translator</h1>
        <p>Translate between 10 different languages</p>
    </header>


    <main class="translator-container">

        <div class="language-section">

            <div class="language-box">
                <label for="from-language">From</label>

                <select id="from-language">
                    <option value="so">🇸🇴 Somali</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ar">🇸🇦 Arabic</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="de">🇩🇪 German</option>
                    <option value="it">🇮🇹 Italian</option>
                    <option value="tr">🇹🇷 Turkish</option>
                    <option value="zh">🇨🇳 Chinese</option>
                    <option value="ja">🇯🇵 Japanese</option>
                </select>
            </div>


            <button id="swap-button" type="button">
                🔄
            </button>


            <div class="language-box">
                <label for="to-language">To</label>

                <select id="to-language">
                    <option value="en"> English</option>
                    <option value="so"> Somali</option>
                    <option value="ar"> Arabic</option>
                    <option value="fr"> French</option>
                    <option value="es"> Spanish</option>
                    <option value="de"> German</option>
                    <option value="it"> Italian</option>
                    <option value="tr">Turkish</option>
                    <option value="zh"> Chinese</option>
                    <option value="ja"> Japanese</option>
                </select>
            </div>

        </div>


        <div class="text-section">

            <div class="text-box">
                <textarea
                    id="input-text"
                    placeholder="Write something to translate"
                ></textarea>

                <span id="input-count">0 characters</span>
            </div>


            <div class="text-box result-box">
                <div id="translation-result">
                    
                </div>
            </div>

        </div>


        <button id="translate-button">
            Translate
        </button>


        <p id="error-message"></p>

    </main>




    <script src="script.js"></script>

</body>
</html>
