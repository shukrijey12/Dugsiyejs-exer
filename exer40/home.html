
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Video Player</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="video-player">

        <!-- HEADER -->
        <div class="player-header">

            <div>
                <span class="small-title">
                    NOW WATCHING
                </span>

                <h1 id="videoTitle">
                    Beautiful Nature
                </h1>
            </div>

            <div class="video-icon">
                <i class="fa-solid fa-video"></i>
            </div>

        </div>


        <!-- VIDEO -->
        <div class="video-container">

            <video
                id="video"
                preload="metadata"
                playsinline
            >
                Your browser does not support HTML5 video.
            </video>

            <!-- CENTER PLAY BUTTON -->
            <button
                id="centerPlay"
                class="center-play"
                type="button"
                aria-label="Play video"
            >
                <i class="fa-solid fa-play"></i>
            </button>

        </div>


        <!-- VIDEO INFORMATION -->
        <div class="video-info">

            <div>

                <h2 id="title">
                    Beautiful Nature
                </h2>

                <p id="category">
                    Nature Video
                </p>

            </div>

            <div class="video-number">

                <span id="videoNumber">
                    1
                </span>

                <span>/</span>

                <span id="totalVideos">
                    3
                </span>

            </div>

        </div>


        <!-- PROGRESS -->
        <div class="progress-section">

            <div class="time">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Video progress"
            >

        </div>


        <!-- MAIN CONTROLS -->
        <div class="main-controls">

            <!-- PREVIOUS -->
            <button
                id="previousBtn"
                class="control-btn"
                type="button"
                title="Previous"
                aria-label="Previous video"
            >
                <i class="fa-solid fa-backward-step"></i>
            </button>


            <!-- PLAY -->
            <button
                id="playBtn"
                class="play-btn"
                type="button"
                title="Play / Pause"
                aria-label="Play or pause video"
            >
                <i class="fa-solid fa-play"></i>
            </button>


            <!-- NEXT -->
            <button
                id="nextBtn"
                class="control-btn"
                type="button"
                title="Next"
                aria-label="Next video"
            >
                <i class="fa-solid fa-forward-step"></i>
            </button>

        </div>


        <!-- BOTTOM CONTROLS -->
        <div class="bottom-controls">

            <!-- VOLUME -->
            <div class="volume-control">

                <i
                    id="volumeIcon"
                    class="fa-solid fa-volume-high"
                ></i>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                    aria-label="Volume"
                >

            </div>


            <!-- SPEED -->
            <div class="speed-control">

                <i class="fa-solid fa-gauge-high"></i>

                <select
                    id="speed"
                    aria-label="Playback speed"
                >

                    <option value="0.5">
                        0.5x
                    </option>

                    <option value="0.75">
                        0.75x
                    </option>

                    <option value="1" selected>
                        1x
                    </option>

                    <option value="1.25">
                        1.25x
                    </option>

                    <option value="1.5">
                        1.5x
                    </option>

                    <option value="2">
                        2x
                    </option>

                </select>

            </div>


            <!-- FULLSCREEN -->
            <button
                id="fullscreenBtn"
                class="fullscreen-btn"
                type="button"
                title="Fullscreen"
                aria-label="Fullscreen"
            >
                <i class="fa-solid fa-expand"></i>
            </button>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
